<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function hello(){
            let a=parseInt(prompt("Enter first value : "));
            let b=parseInt(prompt("Enter second value : "));
            let c=a+b;
            document.write("Sum of two numbers is : "+c);
        }
    </script>
</head>
<body>
    <input type="button" value="Result" onclick="Hello()">
</body>
</html>
