<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>
        Hello Vishal!
    </p>
    <script>
        let a=parseInt(prompt("Enter Age : "));
        if (a >= 18){
            alert("You are eligible for voting");
        }
        else{
            alert("You are not eligible for voting");
        }

        var c = confirm("Do you want to continue ?");
        
        while (c == true){
            a = parseInt(prompt("Enter Age : "));
            if (a >= 18){
                alert("You are eligible for voting");
            }
            else{
                alert("You are not eligible for voting");
            }
            c = confirm("Do you want to continue ?");
        }
    </script>
</body>
