<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern</title>
</head>

<body>

    <pre id="result"></pre>

    <script>
        let a = Number(prompt("Enter the number of lines: "));
        let pattern = "";

        for (let i = 1; i <= a; i++) {
            for (let j = 1; j <= i; j++) {
                pattern += "*";
            }
            pattern += "\n";
        }

        for (let i = a - 1; i >= 1; i--) {
            for (let j = 1; j <= i; j++) {
                pattern += "*";
            }
            pattern += "\n";
        }

        document.getElementById("result").textContent = pattern;
    </script>

</body>

</html>
